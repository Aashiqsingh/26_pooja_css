<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    a{
        background-color: red;
        color: white;
    }
    a[target="_blank"]{
        background-color: blue;
        color: white;
    }
    a[target]{
        background-color: green;
    }
    input[value="Royal"]{
        background-color: yellow;
    }
</style>
<body>
    
    <a href="">Royal</a>
    <a href="" target="_blank">Click me</a>
    <a href="" target="self">Click me</a>
    <a href="" target="_parent">Click me</a>
    <a href="" target="_top">Click me</a>


    <input type="text" name="" id="">
    <input type="text" value="" name="" id="">
    <input type="text" value="Royal" name="" id="">
    <input type="text" value="Royal" name="" id="" disabled>



</body>
</html>
