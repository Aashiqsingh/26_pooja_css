<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box{
        height: 200px;
        width: 200px;
        background-color: red;


        border-width: 10px;
        border-style: solid;
        border-color: yellow;

        border: 10px solid blue;
        border: 10px dashed blue;
        border: 10px dotted blue;
        border: 10px ridge blue;
        border: 10px outset blue;
        border: 10px groove blue;
        border: 10px double blue;
        border: yellow 10px dotted;


        border-bottom: 10px dashed blue;
        border-right: 5px double green;

        border-top-color: darkblue;
        border-image: url('https://upload.wikimedia.org/wikipedia/commons/4/44/BMW.svg');


        outline-width: 10px;
        outline-style: dashed;
        outline-color: violet;

        outline: dashed 10px tomato;

    }
    .box2{
        height: 200px;
        width: 200px;
        background-color: red;
    }
</style>
<body>
    
    <div class="box">

    </div>

    <div class="box2">

    </div>



</body>
</html>
