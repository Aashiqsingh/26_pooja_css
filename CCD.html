<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<style>
    .navbar2{
        height: 90px;
        width: 100%;
        background-color: white;
        display: flex;
        justify-content: space-around;
        align-items: center;
        
    }
    .navbar2 img{
        height: 70px;
    }
    .link a{
        color: red;
        text-decoration: none;
        font-size: 18px;
    }
    .icon i{
        color: red;
    }
    .link{
        display: flex;
        gap: 30px;
    }
    .poster{
        height: auto;
        width: 100%;
    }
    .poster img{
        width: 33.33%;
        height: auto;
    }
    .switch{
        position: relative;
        top: -60px;
        display: flex;
        justify-content: space-around;
    }
    .switch button{
        background-color: #DC4348;
        height: 40px;
        width: auto;
        padding: 0px 20px;
        border-radius: 20px;
        border: none;
    }
</style>
<body>

    <div class="main">

        <div class="slider">
            <div id="carouselExampleInterval" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active" data-bs-interval="2000">
                        <img src="https://www.cafecoffeeday.com/sites/default/files/R-SB23-Website%20Banner-1.png" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item" data-bs-interval="2000">
                        <img src="https://www.cafecoffeeday.com/sites/default/files/SB23-Website%20Banner-2.png" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item" data-bs-interval="2000">
                        <img src="https://www.cafecoffeeday.com/sites/default/files/Heritage-Banner-1920X760.jpg" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item" data-bs-interval="2000">
                        <img src="https://www.cafecoffeeday.com/sites/default/files/Safety-CCD-Web%20Banner-Desktop.png" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item" data-bs-interval="2000">
                        <img src="https://www.cafecoffeeday.com/sites/default/files/1920x760%20%281%29.jpg" class="d-block w-100" alt="...">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleInterval"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleInterval"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
        <!-- slider ending -->
         <div class="navbar2">
            <img src="https://www.cafecoffeeday.com/sites/all/themes/ccd/assets/images/common/logo.png" alt="">
            <div class="link">
                <a href="">Cafe Menu</a>
                <a href="">E-shop <i class="fa-solid fa-cart-shopping"></i></a>
                <a href="">Order Online</a>
                <a href="">Cafe Finder/Cafe Locator</a>
                <a href="">Mobile App/CCD Mobile App</a>
            </div>
            <div class="icon">
                <i class="fa-solid fa-magnifying-glass"></i>&ensp;&ensp;
                <i class="fa-regular fa-bell fa-rotate-by" style="--fa-rotate-angle: -30deg;"></i>&ensp;&ensp;
                <i class="fa-regular fa-circle-user"></i>
            </div>
         </div>
         <!-- navbar ending -->
          <div class="poster">
            <img src="https://www.cafecoffeeday.com/sites/default/files/What%2527sNew-Open-copy_0.gif" alt=""><img src="https://www.cafecoffeeday.com/sites/default/files/map-locator.gif" alt=""><img src="https://www.cafecoffeeday.com/sites/default/files/Shop%20now%20gif%20new.gif" alt="">
            <div class="switch">
                <button>WHAT'S NEW</button>
                <button>FIND A CAFE NEAR YOU</button>
                <button>SHOP NOW</button>
            </div>
        </div>

    </div>


</body>

</html>
