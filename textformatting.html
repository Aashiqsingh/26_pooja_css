<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box{
        /* background-color: red; */
        /* height: 100px;
        width: 100px; */


        height: 300px;
        width: 300px;
        background-color: red;
        color: white;


/* text formatting */



        font-family: 'Courier New', Courier, monospace;
        font-family: cursive;
        font-size: x-large;
        font-size: 20px;
        font-weight: bolder;
        font-weight: 900;
        font-style: italic;
        font-style: oblique;
        

        text-align: center;
        text-align: start;
        text-align: end;
        text-align: justify;
        text-decoration: line-through;
        text-decoration: underline;
        text-decoration: overline;
/* 
        text-decoration: underline blue solid;
        text-decoration: underline blue dashed;
        text-decoration: underline yellow dotted;
        text-decoration: underline yellow double;
        text-decoration: underline yellow wavy;
        text-decoration: line-through yellow  wavy; */

        text-transform: capitalize;
        text-transform: uppercase;
        text-transform: lowercase;

        text-shadow: 2px 2px 2px yellow;
        /* first : left or right
            second : top or bottom
            third : blur
            fourth : color
        
        */
        text-shadow: 2px 2px 0px yellow;
        text-shadow: -2px -1px 0px yellow;
        text-shadow: -2px -1px 3px yellow , 2px 2px 3px blue;

        






    }
</style>
<body>


    <!-- div tag is a container tag. it is also blocked tag. it is also know as division tag. -->

    <div class="box">
        Lorem ipsum, dolor sit amet consectetur adipisicing elit. Ad recusandae at tenetur, incidunt dignissimos iste nobis quas iusto delectus quam, facere harum praesentium magnam fuga id optio amet itaque! Dolorem!
    </div>
    
</body>
</html>
