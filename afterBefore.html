<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    .box{
        height: 300px;
        width: 300px;
        background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTBMNG9_xCn6BCyw2kwc7vRUbnbhTQYzbNwX3QH6n95c0qdzKSFf1u7w8M&s=10');
        background-size: cover;

    }
    .box::before{
        content: '';
        position: absolute;
        height: 300px;
        width: 300px;
        background-color: rgba(255, 0, 0, 0.699);

        transition: 1s;
    }
    .box::after{
        content: '';
        position: absolute;
        height: 300px;
        width: 300px;
        background-color: rgba(0, 0, 0, 0.731);
        /* left: 150px; */
        right: 980px;
        transition: 1s;
    }
    .box:hover::before{
        width: 0;

        transition: 1s;
    }
    .box:hover::after{
        width: 0;

        transition: 1s;
    }

    .box2{
        height: 300px;
        width: 300px;
        background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTBMNG9_xCn6BCyw2kwc7vRUbnbhTQYzbNwX3QH6n95c0qdzKSFf1u7w8M&s=10');
        background-size: cover;


        margin-top: -300px;
        margin-left: 400px;
    }
    .box2::before{
        content: '';
        position: absolute;
        height: 300px;
        width: 300px;
        background-color: rgba(0, 0, 255, 0.831);

        transition: 1s;
    }
    .box2::after{
        content: '';
        position: absolute;
        height: 300px;
        width: 300px;
        background-color: rgba(0, 128, 0, 0.79);
        bottom: 252px;

        transition: 1s;
    }
    .box2:hover::before{
        height: 0;
        width: 0;


        transition: 1s;
    }
    .box2:hover::after{
        height: 0;
        width: 0;

        transition: 1s;
    }
</style>
<body>
    
    <div class="box">

    </div>

    <div class="box2">

    </div>


</body>
</html>
