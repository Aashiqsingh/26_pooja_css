<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box{
        height: 200px;
        width: 200px;
        background-color: red;

        transition: 1s;
    }
    .box:hover{
        background-color: blue;
        cursor: pointer;
        height: 400px;
        width: 400px;
        border-radius: 50%;
        border: 10px dotted yellow;
        margin: 100px 100px;
        background-image: url('https://knowlepedia.org/images/b/b0/Yogi_Adityanath.jpg');
        background-size: cover;

        transition: 1s;
    }
</style>
<body>
    
    <!-- hover : mouse effect -->

    <div class="box">

    </div>




</body>
</html>
